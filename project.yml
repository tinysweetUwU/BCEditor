name: BCEditor
options:
  bundleIdPrefix: com.bceditor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.bceditor.saveeditor
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
targets:
  BCEditor:
    type: application
    platform: iOS
    sources:
      - path: iOS/BCEditor
    resources:
      - path: src/bcsfe
      - path: iOS/PythonRuntime
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: BCEditor
        INFOPLIST_KEY_CFBundleDisplayName: BCEditor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_OBJC_BRIDGING_HEADER: iOS/BCEditor/PythonBridge.h
    scheme:
      testTargets: []
