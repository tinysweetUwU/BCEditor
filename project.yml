name: BCEditor
options:
  bundleIdPrefix: com.bceditor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.bceditor.saveeditor
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: iOS/BCEditor/Info.plist
targets:
  BCEditor:
    type: application
    platform: iOS
    sources:
      - path: iOS/BCEditor
    resources:
      - path: src/bcsfe
      - path: iOS/PythonRuntime
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: BCEditor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: iOS/BCEditor/PythonBridge.h
    scheme:
      testTargets: []
